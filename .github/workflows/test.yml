on: [push, pull_request]
name: Test
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest]
        work-dir: ["./", "./v2", "./v2/redis"]
    runs-on: ${{matrix.os}}
    defaults:
      run:
        working-directory: ${{matrix.work-dir}}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{matrix.go-version}}
        cache-dependency-path: "**/go.sum"
    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.10.1
        working-directory: ${{matrix.work-dir}}
    - name: Check formatting
      run: golangci-lint fmt --diff ./...
    - name: go test
      run: go test -race ./...
    - name: Build example
      if: matrix.work-dir != './v2/redis'
      run: go build -o "$RUNNER_TEMP/http_breaker" ./example
